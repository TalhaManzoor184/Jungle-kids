name: Cleanup old media

# Keeps GitHub storage small: every video, thumbnail and photo a run uploads is deleted
# once it is a day old. Uploads also expire on their own (retention-days: 1); this job
# catches anything left over. Posted videos stay on YouTube/Facebook, untouched.
on:
  schedule:
    - cron: "23 22 * * *" # 3:23 AM Pakistan time, after the evening posts
  workflow_dispatch:

permissions:
  actions: write
  contents: write # to remove posted clips from inbox/

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Delete run artifacts older than 1 day
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cutoff=$(date -u -d '1 day ago' +%Y-%m-%dT%H:%M:%SZ)
          gh api "repos/${{ github.repository }}/actions/artifacts?per_page=100" --paginate \
            --jq ".artifacts[] | select(.created_at < \"$cutoff\") | .id" |
          while read -r id; do gh api -X DELETE "repos/${{ github.repository }}/actions/artifacts/$id" && echo "deleted artifact $id"; done || true

      - uses: actions/checkout@v5

      - name: Remove inbox clips and images older than 1 day
        run: |
          yesterday=$(date -u -d '1 day ago' +%Y-%m-%d)
          for d in inbox/*/; do
            day=$(basename "$d")
            # date folders only, and only those before yesterday
            [[ "$day" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]] && [[ "$day" < "$yesterday" ]] || continue
            find "$d" -type f \( -iname '*.mp4' -o -iname '*.mov' -o -iname '*.webm' -o -iname '*.mp3' -o -iname '*.wav' \
              -o -iname '*.png' -o -iname '*.jpg' -o -iname '*.jpeg' -o -iname '*.webp' \) -print0 | xargs -0 -r git rm -q
          done
          if ! git diff --cached --quiet; then
            git config user.name "cleanup-bot"
            git config user.email "cleanup-bot@users.noreply.github.com"
            git commit -qm "chore: remove posted inbox media older than 1 day [skip ci]"
            for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 5; done
          else
            echo "No old inbox media."
          fi
