name: Inbox reel (clips from Google Flow)

# Free mode (CLIP_SOURCE=inbox): when you upload shot1.mp4 ... shot4.mp4 into inbox/<date>/,
# this assembles the reel and uploads it to YouTube.
on:
  push:
    paths:
      - "inbox/**/shot*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: jungle-reel
  cancel-in-progress: false

env:
  UPLOAD_MODE: ${{ vars.UPLOAD_MODE || 'schedule' }}
  PUBLISH_TIME: ${{ vars.PUBLISH_TIME || '18:00' }}
  PUBLISH_UTC_OFFSET: ${{ vars.PUBLISH_UTC_OFFSET || '5' }}
  MADE_FOR_KIDS: ${{ vars.MADE_FOR_KIDS || 'false' }}
  SHOT_SECONDS: ${{ vars.SHOT_SECONDS || '6' }}

jobs:
  assemble:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install -r requirements.txt

      - name: Assemble and upload
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: python -m jungle.run --from-inbox

      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: inbox-reel-${{ github.run_number }}
          path: out/*/reel.mp4
          retention-days: 14
          if-no-files-found: ignore

      - name: Save history
        if: always()
        run: |
          git config user.name "jungle-bot"
          git config user.email "jungle-bot@users.noreply.github.com"
          git add -A data/history.json inbox
          if ! git diff --cached --quiet; then
            git commit -m "Inbox reel $(date -u +%F)"
            git pull --rebase --autostash && git push
          fi
